name: 'Static Analysis'

on:
    pull_request: ~
    push:
        branches:
            - 'main'

jobs:
    static-analysis:
        runs-on: 'ubuntu-latest'

        strategy:
            matrix:
                include:
                  - php-version: '8.1'
                    magento: '2.4.4.*'
                  - php-version: '8.1'
                    magento: '2.4.5.*'
                  - php-version: '8.2'
                    magento: '2.4.6.*'
                  - php-version: '8.3'
                    magento: '2.4.7.*'
                  - php-version: '8.4'
                    magento: '2.4.8.*'
                  - php-version: '8.5'
                    magento: '2.4.9.*'

        steps:
            - name: 'Checkout'
              uses: 'actions/checkout@v3'

            - name: 'Install PHP'
              uses: 'shivammathur/setup-php@v2'
              with:
                  php-version: '${{ matrix.php-version }}'
                  coverage: 'none'
                  tools: 'composer:v2'
              env:
                  COMPOSER_AUTH_JSON: |
                      {
                          "http-basic": {
                              "repo.magento.com": {
                                  "username": "${{ secrets.MAGENTO_USERNAME }}",
                                  "password": "${{ secrets.MAGENTO_PASSWORD }}"
                              }
                          }
                      }

            - name: 'Get composer cache directory'
              id: 'composer-cache'
              run: 'echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT'

            - name: 'Cache dependencies'
              uses: 'actions/cache@v3'
              with:
                  path: '${{ steps.composer-cache.outputs.dir }}'
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: '${{ runner.os }}-composer-'

            - name: 'Install dependencies'
              run: |
                # Pin the whole Magento release, so that the Magento modules match the framework version.
                composer config audit.block-insecure false
                for plugin in magento/magento-composer-installer magento/composer-dependency-version-audit-plugin magento/inventory-composer-installer php-http/discovery; do composer config "allow-plugins.$plugin" false; done
                composer require --dev --no-update "magento/product-community-edition:${{ matrix.magento }}"
                composer update --prefer-dist

            - name: 'Run composer audit'
              # Older Magento releases depend on packages with known advisories: audit the latest release only.
              if: "matrix.magento == '2.4.9.*'"
              run: 'composer audit --format=plain --abandoned=report'

            - name: 'Run Parallel Lint'
              run: 'vendor/bin/parallel-lint --exclude vendor .'

            - name: 'Run PHP CodeSniffer'
              run: 'vendor/bin/phpcs --extensions=php,phtml'

            - name: 'Run PHPMD'
              run: 'vendor/bin/phpmd analyze .'

            - name: 'Run PHPStan'
              run: 'vendor/bin/phpstan analyse'
