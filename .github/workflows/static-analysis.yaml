name: 'CI'

# Maintenance line for Magento 2.4.4 and 2.4.5. These releases have no Mage-OS equivalent:
# they are installed from the Mage-OS mirror of Magento, which needs no Magento credentials.

on:
  pull_request: ~
  push:
    branches:
      - 'main'

jobs:
  static-analysis:
    runs-on: 'ubuntu-latest'
    env:
      # Magento 2.4.5 depends on packages with known security advisories.
      COMPOSER_NO_SECURITY_BLOCKING: 1

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Install PHP'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '8.1'
          coverage: 'none'
          tools: 'composer:v2'

      - name: 'Get composer cache directory'
        id: 'composer-cache'
        run: 'echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT'

      - name: 'Cache dependencies'
        uses: 'actions/cache@v4'
        with:
          path: '${{ steps.composer-cache.outputs.dir }}'
          key: "${{ runner.os }}-composer-${{ hashFiles('composer.json') }}"
          restore-keys: '${{ runner.os }}-composer-'

      - name: 'Install dependencies'
        run: |
          # Install the whole Magento 2.4.5 release, so that the Magento modules match the framework version.
          jq 'del(.repositories)' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
          composer config repositories.magento-mirror '{"type": "composer", "url": "https://mirror.mage-os.org/", "canonical": false}'
          for plugin in mage-os/magento-composer-installer mage-os/composer-dependency-version-audit-plugin mage-os/inventory-composer-installer magento/magento-composer-installer magento/composer-dependency-version-audit-plugin magento/inventory-composer-installer php-http/discovery; do composer config "allow-plugins.$plugin" false; done
          composer require --dev --no-update "magento/product-community-edition:2.4.5.*"
          composer update --prefer-dist

      - name: 'Run Parallel Lint'
        run: 'vendor/bin/parallel-lint --exclude vendor .'

      - name: 'Run PHP CodeSniffer'
        run: 'vendor/bin/phpcs --extensions=php,phtml'

      - name: 'Run PHPMD'
        run: 'vendor/bin/phpmd . xml phpmd.xml.dist'

      - name: 'Run PHPStan'
        run: 'vendor/bin/phpstan analyse'

  # Same steps as the "compile-extension" job of graycoreio/github-actions-magento2 (used by the mage-os-lab modules).
  compile:
    name: 'Compile (${{ matrix.name }})'
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Magento 2.4.4'
            php: '8.1'
            project: 'magento/project-community-edition:2.4.4.*'
            repository: 'https://mirror.mage-os.org/'
          - name: 'Magento 2.4.5'
            php: '8.1'
            project: 'magento/project-community-edition:2.4.5.*'
            repository: 'https://mirror.mage-os.org/'
    env:
      # The older releases depend on packages with known security advisories.
      COMPOSER_NO_SECURITY_BLOCKING: 1

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Create the project'
        uses: 'graycoreio/github-actions-magento2/setup-magento@v8.12.0'
        id: 'setup-magento'
        with:
          php-version: '${{ matrix.php }}'
          tools: 'composer:v2'
          mode: 'extension'
          magento_version: '${{ matrix.project }}'
          magento_repository: '${{ matrix.repository }}'

      - name: 'Get package name'
        id: 'package'
        run: 'echo "name=$(jq -r .name composer.json)" >> $GITHUB_OUTPUT'

      - name: 'Require the module'
        working-directory: '${{ steps.setup-magento.outputs.path }}'
        run: |
          composer config repositories.local path ${{ github.workspace }}
          composer require "${{ steps.package.outputs.name }}:@dev" --no-install
          composer update --no-install

      - uses: 'graycoreio/github-actions-magento2/cache-magento@v8.12.0'
        with:
          composer_cache_key: '${{ matrix.name }}'
          working-directory: '${{ steps.setup-magento.outputs.path }}'

      - name: 'Install dependencies'
        working-directory: '${{ steps.setup-magento.outputs.path }}'
        run: 'composer install'
        env:
          COMPOSER_MIRROR_PATH_REPOS: 1

      - name: 'Compile'
        uses: 'graycoreio/github-actions-magento2/setup-di-compile@v8.12.0'
        with:
          path: '${{ steps.setup-magento.outputs.path }}'
