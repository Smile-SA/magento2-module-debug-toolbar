name: 'Static Analysis'

on:
    pull_request: ~
    push:
        branches:
            - 'main'

jobs:
    static-analysis:
        runs-on: 'ubuntu-latest'

        strategy:
            matrix:
                include:
                  - php-version: '8.3'
                    magento: '103.0.7.*'
                  - php-version: '8.4'
                    magento: '103.0.8.*'
                  - php-version: '8.5'
                    magento: '103.0.9.*'

        steps:
            - name: 'Checkout'
              uses: 'actions/checkout@v3'

            - name: 'Install PHP'
              uses: 'shivammathur/setup-php@v2'
              with:
                  php-version: '${{ matrix.php-version }}'
                  coverage: 'none'
                  tools: 'composer:v2'
              env:
                  COMPOSER_AUTH_JSON: |
                      {
                          "http-basic": {
                              "repo.magento.com": {
                                  "username": "${{ secrets.MAGENTO_USERNAME }}",
                                  "password": "${{ secrets.MAGENTO_PASSWORD }}"
                              }
                          }
                      }

            - name: 'Get composer cache directory'
              id: 'composer-cache'
              run: 'echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT'

            - name: 'Cache dependencies'
              uses: 'actions/cache@v3'
              with:
                  path: '${{ steps.composer-cache.outputs.dir }}'
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: '${{ runner.os }}-composer-'

            - name: 'Install dependencies'
              run: 'composer update --prefer-dist --with "magento/framework:${{ matrix.magento }}"'

            - name: 'Run composer audit'
              run: 'composer audit --format=plain --abandoned=report'

            - name: 'Run Parallel Lint'
              run: 'vendor/bin/parallel-lint --exclude vendor .'

            - name: 'Run PHP CodeSniffer'
              run: 'vendor/bin/phpcs --extensions=php,phtml'

            - name: 'Run PHPMD'
              run: 'vendor/bin/phpmd analyze .'

            - name: 'Run PHPStan'
              run: 'vendor/bin/phpstan analyse'
